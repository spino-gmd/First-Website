            <div class="form-group">
                <label for="user-name">Name</label>

            </div>

            <div class="form-group">
                <label for="user-email">Email</label>
                <input type="email" name="User e-mail" id="user-email" required placeholder="Enter your e-mail">
            </div>

            <div class="form-group">
                <label for="user-message">Your message</label>
                <textarea id="user-message" name="E-mail Text" required rows="5" placeholder="Write your e-mail message here..."></textarea>
            </div>

            <a href="contact.html">
            <button type="submit" class="submit-button">Simulate messaging</button>
            </a>

        </form>
